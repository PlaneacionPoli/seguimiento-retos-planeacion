<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avanza · Gestor de Planeación</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='24' y2='24'%3E%3Cstop offset='0' stop-color='%230ea9c2'/%3E%3Cstop offset='1' stop-color='%231f9fd6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='24' height='24' rx='6' fill='url(%23g)'/%3E%3Crect x='3' y='14' width='3.4' height='7' rx='1' fill='white' opacity='.55'/%3E%3Crect x='8.6' y='10' width='3.4' height='11' rx='1' fill='white' opacity='.8'/%3E%3Crect x='14.2' y='6' width='3.4' height='15' rx='1' fill='white'/%3E%3Cpath d='M13.6 4H20V10.4' stroke='white' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3Cpath d='M20 4L12.3 11.7' stroke='white' stroke-width='1.8' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1" rel="stylesheet">

    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
    <script>
        const firebaseConfig = {{ firebase_config | tojson }};
        firebase.initializeApp(firebaseConfig);
    </script>
    <style>
        :root{ --brand:#1d3050; --brand-ink:#0f1c30; --brand-2:#0ea9c2; --accent:#1f9fd6; --accent-ink:#0c6f96;
               --border:#e1e8f0; --ink:#152238; --ink-soft:#4c5b70; --ink-faint:#8593a6; --bg:#f3f6f9;
               --danger:#c23c46; --danger-bg:#fbe9ea; --good:#128a63; --good-bg:#e3f5ee; }
        *{box-sizing:border-box}
        body{margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px;
             background:var(--bg); font-family:"Montserrat",system-ui,sans-serif; color:var(--ink);}
        .material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 500; vertical-align:middle;}
        .card{width:100%; max-width:400px; background:#fff; border:1px solid var(--border); border-radius:18px;
              box-shadow:0 18px 48px -12px rgba(15,28,48,.24); padding:32px;}
        .brand-mark{width:56px;height:56px;border-radius:16px;margin:0 auto 16px;background:linear-gradient(135deg,var(--brand-2),var(--accent));
                    display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 8px 20px -6px rgba(31,159,214,.6);}
        h1{font-family:"Poppins",sans-serif; font-size:26px; font-weight:800; color:var(--ink); text-align:center; margin:0; letter-spacing:.2px}
        p.sub{text-align:center; color:var(--ink-faint); font-size:13px; font-weight:600; letter-spacing:.3px; text-transform:uppercase; margin:4px 0 24px}
        .tabs{display:flex; background:#eaf1f6; border-radius:10px; padding:3px; margin-bottom:20px;}
        .tabs span{flex:1; text-align:center; padding:8px; border-radius:8px; font-size:13px; font-weight:600; color:var(--ink-soft); cursor:pointer;}
        .tabs span.active{background:#fff; color:var(--accent-ink); box-shadow:0 1px 3px rgba(0,0,0,.08);}
        label{font-size:11px; font-weight:700; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.3px; display:block; margin-bottom:5px;}
        .field{position:relative; margin-bottom:16px;}
        .field .material-symbols-outlined{position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--ink-faint); font-size:18px;}
        .field input{width:100%; padding:10px 12px 10px 36px; border-radius:9px; border:1px solid var(--border); font-size:14px; font-family:inherit; color:var(--ink);}
        .field input:focus{outline:none; border-color:var(--accent);}
        .field.plain input{padding-left:12px}
        .toggle-eye{position:absolute; right:10px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; color:var(--ink-faint);}
        button.submit{width:100%; padding:11px; border:none; border-radius:10px; background:var(--accent); color:#fff;
                       font-weight:700; font-size:13.5px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px;
                       box-shadow:0 4px 14px -4px rgba(31,159,214,.6);}
        button.submit:hover{background:var(--accent-ink)}
        button.submit:disabled{opacity:.7}
        .banner{margin-top:14px; padding:10px 12px; border-radius:9px; font-size:12.5px; display:flex; align-items:center; gap:8px;}
        .banner.err{background:var(--danger-bg); color:var(--danger);}
        .banner.ok{background:var(--good-bg); color:var(--good);}
        .hint{font-size:10.5px; color:var(--ink-faint); margin-top:3px;}
    </style>
</head>
<body x-data="loginData()" x-init="checkAuth()">

    <div class="card">
        <div class="brand-mark">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="3" y="14" width="3.4" height="7" rx="1" fill="#fff" opacity=".55"/>
                <rect x="8.6" y="10" width="3.4" height="11" rx="1" fill="#fff" opacity=".8"/>
                <rect x="14.2" y="6" width="3.4" height="15" rx="1" fill="#fff"/>
                <path d="M13.6 4H20V10.4" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M20 4L12.3 11.7" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
        </div>
        <h1>Avanza</h1>
        <p class="sub">Gestor de Planeación</p>

        <div class="tabs">
            <span :class="isLogin ? 'active' : ''" @click="isLogin = true">Iniciar Sesión</span>
            <span :class="!isLogin ? 'active' : ''" @click="isLogin = false">Registrarse</span>
        </div>

        <form x-show="isLogin" @submit.prevent="handleLogin">
            <label>Correo electrónico</label>
            <div class="field">
                <span class="material-symbols-outlined">mail</span>
                <input type="email" x-model="email" placeholder="tu@email.com" required>
            </div>
            <label>Contraseña</label>
            <div class="field">
                <span class="material-symbols-outlined">lock</span>
                <input :type="showPassword ? 'text' : 'password'" x-model="password" placeholder="••••••••" required>
                <button type="button" class="toggle-eye" @click="showPassword = !showPassword">
                    <span class="material-symbols-outlined" x-text="showPassword ? 'visibility_off' : 'visibility'"></span>
                </button>
            </div>
            <button type="submit" class="submit" :disabled="loading">
                <span class="material-symbols-outlined" x-show="!loading" style="font-size:16px">login</span>
                <span x-text="loading ? 'Iniciando sesión...' : 'Iniciar Sesión'"></span>
            </button>
        </form>

        <form x-show="!isLogin" @submit.prevent="handleRegister">
            <label>Nombre completo</label>
            <div class="field plain"><input type="text" x-model="nombreCompleto" placeholder="Juan Pérez"></div>
            <label>Correo electrónico</label>
            <div class="field">
                <span class="material-symbols-outlined">mail</span>
                <input type="email" x-model="email" placeholder="tu@email.com" required>
            </div>
            <label>Contraseña</label>
            <div class="field">
                <span class="material-symbols-outlined">lock</span>
                <input :type="showPassword ? 'text' : 'password'" x-model="password" placeholder="••••••••" required minlength="6">
            </div>
            <div class="hint">Mínimo 6 caracteres</div>
            <button type="submit" class="submit" style="margin-top:12px" :disabled="loading">
                <span class="material-symbols-outlined" x-show="!loading" style="font-size:16px">person_add</span>
                <span x-text="loading ? 'Registrando...' : 'Crear Cuenta'"></span>
            </button>
        </form>

        <div class="banner err" x-show="error" x-transition><span class="material-symbols-outlined" style="font-size:16px">error</span><span x-text="errorMessage"></span></div>
        <div class="banner ok" x-show="success" x-transition><span class="material-symbols-outlined" style="font-size:16px">check_circle</span><span x-text="successMessage"></span></div>
    </div>

    <script>
        function loginData() {
            return {
                isLogin: true, showPassword: false, loading: false,
                error: false, success: false, errorMessage: '', successMessage: '',
                email: '', password: '', nombreCompleto: '',

                checkAuth() {
                    firebase.auth().onAuthStateChanged((user) => {
                        if (user) window.location.href = '/dashboard';
                    });
                },
                async handleLogin() {
                    this.loading = true; this.error = false;
                    try {
                        await firebase.auth().signInWithEmailAndPassword(this.email, this.password);
                        localStorage.setItem('user_email', this.email);
                        this.success = true; this.successMessage = '¡Inicio de sesión exitoso! Redirigiendo...';
                        setTimeout(() => window.location.href = '/dashboard', 1000);
                    } catch (err) {
                        this.error = true; this.errorMessage = err.message || 'Credenciales inválidas';
                    } finally { this.loading = false; }
                },
                async handleRegister() {
                    this.loading = true; this.error = false;
                    try {
                        const response = await fetch('/api/auth/register', {
                            method: 'POST', headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ email: this.email, password: this.password, nombre_completo: this.nombreCompleto })
                        });
                        if (response.ok) {
                            const data = await response.json();
                            await firebase.auth().signInWithCustomToken(data.custom_token);
                            localStorage.setItem('user_email', data.email);
                            this.success = true; this.successMessage = '¡Cuenta creada exitosamente! Redirigiendo...';
                            setTimeout(() => window.location.href = '/dashboard', 1000);
                        } else {
                            const errorData = await response.json();
                            this.error = true; this.errorMessage = errorData.detail || 'Error al crear cuenta';
                        }
                    } catch (err) {
                        this.error = true; this.errorMessage = err.message || 'Error de conexión. Verifica tu red.';
                    } finally { this.loading = false; }
                }
            }
        }
    </script>
</body>
</html>
